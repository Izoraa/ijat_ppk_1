<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Restoran</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Katalog Restoran</h1>
        <p>Temukan restoran favoritmu</p>
    </header>

    <main>
        <section class="restaurant-list">

            <div class="restaurant-card">
                <h2>Warung Nusantara</h2>
                <p>🍛 Masakan Indonesia</p>
                <p>📍 Bandung</p>
                <p>⭐ 4.8</p>
                <button onclick="lihatDetail('Warung Nusantara')">
                    Lihat Detail
                </button>
            </div>

            <div class="restaurant-card">
                <h2>Kedai Jepang</h2>
                <p>🍜 Masakan Jepang</p>
                <p>📍 Jakarta</p>
                <p>⭐ 4.6</p>
                <button onclick="lihatDetail('Kedai Jepang')">
                    Lihat Detail
                </button>
            </div>

            <div class="restaurant-card">
                <h2>Pizza Corner</h2>
                <p>🍕 Pizza & Pasta</p>
                <p>📍 Surabaya</p>
                <p>⭐ 4.7</p>
                <button onclick="lihatDetail('Pizza Corner')">
                    Lihat Detail
                </button>
            </div>

        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
